<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2026 Flights · Collage Themes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;700&family=Big+Shoulders+Display:wght@700;900&family=DM+Sans:wght@500;700&family=Archivo:wght@800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="world-countries.js"></script>
<script src="us-states.js"></script>
<script src="logos.js"></script>
<style>
/* A desk collage, 1080×1920: handwritten title, pinned map clipping, sticky notes, a passport page of stamps (left) and an itemized receipt (right). */
:root { --wall: #eceef1; --ink: #262a33; --pin: #d63a3a; --hand: "Caveat", cursive; --marker: "Permanent Marker", cursive; --mono: "IBM Plex Mono", monospace; --typed: "Special Elite", monospace; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
.pg { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--wall); color: var(--ink); }
h1 { position: absolute; top: 46px; left: 60px; font: 700 92px/1 var(--hand); transform: rotate(-2deg); color: var(--title, #262a33); }
h1 span { display: inline-block; margin: 10px 0 0 120px; font: 400 76px/1 var(--marker); background: linear-gradient(transparent 55%, var(--hl) 55% 92%, transparent 92%); padding: 0 12px; transform: rotate(-3deg); color: var(--hlInk, #262a33); }
.doodle { position: absolute; z-index: 9; }
.burst { position: absolute; z-index: 10; }
.pin { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a8a, var(--pin) 60%); box-shadow: 0 4px 5px rgba(0,0,0,.3); z-index: 9; }
.tape { position: absolute; height: 46px; background: var(--tape1); z-index: 9; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.mapcard { position: absolute; top: 250px; left: 40px; width: 1000px; height: 700px; background: #fff; padding: 18px 18px 0; transform: rotate(-1deg); box-shadow: 0 16px 30px rgba(30,40,60,.18); }
.mapcard svg { width: 964px; height: 560px; display: block; border-radius: 4px; }
.legend { display: flex; justify-content: space-between; align-items: center; padding: 18px 6px 0; }
.legend div { display: flex; align-items: center; gap: 8px; font: 700 26px var(--hand); }
.legend .sw { display: block; height: 5px; border-radius: 3px; margin-top: 6px; }

.note { position: absolute; padding: 22px 26px; box-shadow: 0 12px 20px rgba(30,30,50,.18); font-family: var(--hand); z-index: 8; }
.note b { display: block; font: 400 40px/1 var(--marker); margin-bottom: 10px; }
.note div { font-size: 38px; line-height: 44px; }

.passport { position: absolute; top: 960px; left: 34px; width: 560px; height: 920px; transform: rotate(-3deg); border-radius: 10px; overflow: hidden; box-shadow: 0 18px 34px rgba(30,40,60,.22);
  background: repeating-radial-gradient(circle at 50% 45%, transparent 0 14px, rgba(40,100,90,.08) 14px 16px), var(--pp); }
.passport .hd { position: absolute; top: 26px; left: 34px; right: 34px; display: flex; justify-content: space-between; font: 400 22px var(--typed); letter-spacing: .4em; color: #4f6f68; }
.passport .no { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font: 400 22px var(--typed); color: #4f6f68; }
.st { position: absolute; display: grid; place-items: center; text-align: center; font-family: var(--typed); mix-blend-mode: multiply; opacity: .88; }
.st b { display: block; font: 900 54px/1 "Big Shoulders Display"; letter-spacing: .05em; }
.st small { display: block; font-size: 15px; letter-spacing: .12em; }

.receipt { position: absolute; top: 990px; left: 600px; width: 450px; height: 900px; background: var(--rc); transform: rotate(2.5deg); box-shadow: 0 18px 34px rgba(30,40,60,.2); padding: 36px 30px; font: 400 19px/1.45 var(--mono); color: #232323; }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; background: linear-gradient(135deg, var(--rc) 50%, transparent 50%) 0 0/24px 24px, linear-gradient(225deg, var(--rc) 50%, transparent 50%) 0 0/24px 24px; }
.receipt h2 { font: 700 40px/1 var(--mono); text-align: center; letter-spacing: .06em; }
.receipt .c { text-align: center; color: #666; font-size: 16px; margin-top: 6px; }
.receipt .hr { border-top: 2px dashed #b5b5b5; margin: 14px 0; }
.receipt .it { display: grid; grid-template-columns: 62px 1fr 78px 56px; align-items: center; height: 34px; }
.receipt .it span:last-child { text-align: right; }
.receipt .tot { display: flex; justify-content: space-between; font: 700 30px var(--mono); }
.receipt .sub { display: flex; justify-content: space-between; }
.receipt .bc { height: 64px; margin: 18px auto 8px; width: max-content; }
</style>
</head>
<body>
<div class="pg" id="pg">
  <h1>2026, flights I have taken<br><span>in the air.</span></h1>

  <div class="mapcard"><svg id="map"></svg><div class="legend" id="legend"></div></div>
  <span class="pin" style="top:240px;left:520px"></span>

  <div class="passport" id="passport"><div class="hd"><span>VISAS</span><span>2026</span></div><div class="no">— 14 —</div></div>
  <div class="tape" style="top:940px;left:200px;width:170px;transform:rotate(-8deg)"></div>

  <div class="receipt" id="receipt"></div>
  <div class="tape" style="top:972px;left:760px;width:150px;transform:rotate(6deg);background:var(--tape2)"></div>
</div>
<script>

/* ---------- 20 looks: pick with #c1 … #c20 ---------- */
const dots = c => `radial-gradient(${c} 1px, transparent 1.5px) 0 0/12px 12px`;
const BASE = { wall: `${dots("rgba(0,0,0,.035)")}, #eceef1`, title: "#262a33", hl: "#ffd36b", tape1: "rgba(255,226,140,.75)", tape2: "rgba(160,210,255,.7)", pp: "#dfeae5", rc: "#fff", n1: "#ffe680", n2: "#a8e6cf", water: "#cfe5f3", land: "#f4f2ea", land2: "#e9e6db", mirror: false };
const sparkle = (n, colors, seed = 1) => Array.from({ length: n }, (_, i) => { const x = (i * 197 + seed * 53) % 1080, y = (i * 331 + seed * 97) % 1920, s = 10 + (i * 7) % 18, c = colors[i % colors.length];
  return `<svg style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px" viewBox="0 0 20 20"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8Z" fill="${c}"/></svg>`; }).join("");
const confetti = (n, colors) => Array.from({ length: n }, (_, i) => { const x = (i * 211) % 1080, y = (i * 389) % 1920, w = 10 + (i * 5) % 14, r = (i * 37) % 180, c = colors[i % colors.length], round = i % 3 === 0;
  return `<i style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${round ? w : w / 2.4}px;border-radius:${round ? "50%" : "2px"};background:${c};transform:rotate(${r}deg);opacity:.85"></i>`; }).join("");
const THEMES = [
  { name: "easy · clean" },
  { name: "lively · confetti", cards: "box-shadow: 14px 14px 0 #ffb800",  wall: "#fff7ec", hl: "#ff9cc7", n1: "#ffe14d", n2: "#7ce0c3", tape1: "rgba(255,95,162,.6)", tape2: "rgba(77,163,255,.6)",
    deco: confetti(140, ["#ff5fa2","#ffb800","#4da3ff","#36c98e","#9b6bff","#ff7a45"]) },
  { name: "luxury · black & gold", cards: "border: 8px solid #c9a24a; box-shadow: 0 0 0 2px #f3dc8f, 0 24px 40px rgba(0,0,0,.5)",  wall: "linear-gradient(135deg, rgba(255,255,255,.05) 0 25%, transparent 25% 50%, rgba(255,255,255,.05) 50% 75%, transparent 75%) 0 0/8px 8px, radial-gradient(ellipse at 50% 20%, #26231d, #0c0b0a 75%)", title: "#e6c77a", hl: "#b8902f", hlInk: "#fff8e6", n1: "#f3e7c9", n2: "#e9dcc2", tape1: "linear-gradient(90deg,#b8902f,#f3dc8f,#b8902f)", tape2: "linear-gradient(90deg,#b8902f,#f3dc8f,#b8902f)", pp: "#e9e4d6", rc: "#fbf7ee", water: "#d9d2bf", land: "#fbf8f0", land2: "#efe9db",
    deco: sparkle(26, ["#e6c77a","#f3dc8f"], 3) },
  { name: "luxury · emerald velvet", cards: "border: 8px solid #c9a24a; box-shadow: 0 0 0 2px #f3dc8f, 0 24px 40px rgba(0,0,0,.45)",  wall: "radial-gradient(ellipse at 30% 20%, #1f6b52 0%, #0d3a2c 70%, #082519 100%)", title: "#f0d58c", hl: "#c9a24a", hlInk: "#082519", n1: "#f3e7c9", n2: "#f7d9d0", tape1: "linear-gradient(90deg,#b8902f,#f3dc8f,#b8902f)", tape2: "rgba(243,231,201,.8)", pp: "#e8efe9", rc: "#fbf7ee", water: "#cfe3da",
    deco: sparkle(18, ["#f0d58c"], 5) },
  { name: "luxury · blush marble", cards: "border: 6px solid #d4af5e; box-shadow: 0 18px 34px rgba(120,80,60,.2)",  wall: "linear-gradient(115deg, transparent 40%, rgba(190,160,150,.25) 42%, transparent 44%), linear-gradient(35deg, transparent 60%, rgba(190,160,150,.2) 61%, transparent 63%), linear-gradient(160deg, transparent 20%, rgba(200,170,160,.18) 21%, transparent 23%), #f6ece9", title: "#3b2a2a", hl: "#e8c58c", n1: "#ffffff", n2: "#f6d6d6", tape1: "linear-gradient(90deg,#c9a24a,#f3dc8f,#c9a24a)", tape2: "rgba(240,200,200,.8)", pp: "#f4e8e6", water: "#efdcd8",
    deco: sparkle(14, ["#d4af5e"], 7) },
  { name: "anime · manga", cards: "border: 6px solid #111; box-shadow: 12px 12px 0 #111",  wall: "repeating-conic-gradient(from 0deg at 50% 38%, rgba(0,0,0,.07) 0 2deg, transparent 2deg 7deg), radial-gradient(rgba(0,0,0,.18) 1.5px, transparent 2px) 0 0/10px 10px, #ffffff", hl: "#ff8fb8", n1: "#fff27a", n2: "#9be7ff", tape1: "rgba(255,79,139,.55)", tape2: "rgba(80,190,255,.55)",
    deco: `<div style="position:absolute;left:640px;top:1880px;font:400 60px 'Permanent Marker';color:#ff4f8b;transform:rotate(-8deg)">!!</div>` },
  { name: "anime · kawaii pastel", cards: "border: 6px solid #fff; border-radius: 28px; box-shadow: 0 12px 0 #ffb3d9, 0 20px 30px rgba(150,80,160,.2)",  wall: "linear-gradient(170deg, #ffd6ec 0%, #e3d4ff 50%, #c9ecff 100%)", hl: "#ffffff", hlInk: "#ff4f8b", n1: "#fff3a0", n2: "#ffd6ec", tape1: "rgba(255,255,255,.75)", tape2: "rgba(255,170,210,.7)", pp: "#f3eaff", water: "#d6e8ff",
    deco: sparkle(40, ["#ffffff","#ffd84d","#ff8fc8"], 9) },
  { name: "anime · retro sunset", cards: "border: 5px solid #fff; box-shadow: 12px 12px 0 #ff4f8b",  wall: "linear-gradient(transparent 70%, rgba(255,255,255,.14) 70% 70.3%, transparent 70.3%) 0 0/100% 60px, linear-gradient(180deg, #2b1055 0%, #7b2f8f 40%, #ff6f61 75%, #ffc371 100%)", title: "#ffffff", hl: "#ff4f8b", hlInk: "#fff", n1: "#ffe66d", n2: "#7ef0d0", water: "#d0c8ff",
    deco: `<div style="position:absolute;left:740px;top:60px;width:300px;height:300px;border-radius:50%;background:linear-gradient(#ffe66d,#ff6f61);opacity:.55"></div>` + sparkle(22, ["#ffffff"], 11) },
  { name: "fun · cork board", wall: "radial-gradient(rgba(80,40,10,.25) 1px, transparent 1.5px) 0 0/12px 12px, radial-gradient(rgba(255,230,190,.25) 2px, transparent 3px) 5px 7px/17px 17px, #c4955f", hl: "#fff3a0", n2: "#ffb3c7", mirror: true },
  { name: "fun · terrazzo", wall: "radial-gradient(circle at 20% 30%, #f6b8b8 6px, transparent 7px) 0 0/90px 90px, radial-gradient(circle at 70% 60%, #b8d8f6 5px, transparent 6px) 0 0/70px 70px, radial-gradient(circle at 40% 80%, #f6dfa0 4px, transparent 5px) 0 0/60px 60px, #f3f0eb", hl: "#b8d8f6", n1: "#f6b8b8", n2: "#fff3a0" },
  { name: "beautiful · watercolor", wall: "radial-gradient(ellipse 600px 400px at 10% 20%, rgba(255,182,193,.55), transparent 70%), radial-gradient(ellipse 500px 500px at 90% 50%, rgba(173,216,255,.6), transparent 70%), radial-gradient(ellipse 600px 400px at 30% 90%, rgba(255,226,160,.55), transparent 70%), #fdfbf8", hl: "#ffd1dc", n1: "#fff6c8", n2: "#d6ecff", water: "#d6e8f7" },
  { name: "beautiful · lavender dusk", wall: "linear-gradient(170deg, #f3e9ff 0%, #dccdfb 60%, #c7b8f0 100%)", hl: "#ffffff", hlInk: "#6a4fb3", pp: "#efe8fb", n1: "#ffffff", n2: "#ffd6e2", water: "#ddd8f7", tape1: "rgba(255,255,255,.7)",
    deco: sparkle(20, ["#ffffff"], 13) },
  { name: "attractive · coral pop", cards: "box-shadow: 14px 14px 0 #1fd1c1",  wall: `radial-gradient(rgba(255,255,255,.25) 2px, transparent 2.5px) 0 0/26px 26px, #ff7a6b`, title: "#ffffff", hl: "#1fd1c1", hlInk: "#fff", n1: "#fff27a", n2: "#ffffff", tape1: "rgba(31,209,193,.7)", tape2: "rgba(255,242,122,.8)", water: "#cfeff0" },
  { name: "attractive · navy & gold", cards: "border: 6px solid #ffc24b; box-shadow: 0 20px 40px rgba(0,0,0,.4)",  wall: `radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.5px) 0 0/12px 12px, #1d2b4f`, title: "#ffffff", hl: "#ffc24b", pp: "#efe2e4", n1: "#ffc24b", n2: "#9fd3ff", water: "#b9cdf0", mirror: true },
  { name: "quality · linen", wall: "repeating-linear-gradient(0deg, rgba(120,100,70,.05) 0 2px, transparent 2px 5px), repeating-linear-gradient(90deg, rgba(120,100,70,.05) 0 2px, transparent 2px 5px), #efe8dc", hl: "#c9e4ff", pp: "#dfe7f3", n1: "#fff3a0", n2: "#f9c6a8" },
  { name: "quality · leather & kraft", wall: "radial-gradient(rgba(0,0,0,.12) 1px, transparent 1.6px) 0 0/7px 7px, radial-gradient(ellipse at 50% 30%, #8b5a3c, #5c3a25 80%)", title: "#f6e7cf", hl: "#e0b26b", hlInk: "#3b2416", n1: "#f6e7cf", n2: "#d9c3a0", rc: "#fffbea", tape1: "rgba(246,231,207,.7)", mirror: true },
  { name: "easy · graph paper", wall: "linear-gradient(#cfe0f3 1.5px, transparent 1.5px) 0 0/54px 54px, linear-gradient(90deg, #cfe0f3 1.5px, transparent 1.5px) 0 0/54px 54px, #fbfdff", hl: "#9be3c8", n1: "#ffe680", n2: "#ffb3c7" },
  { name: "easy · mint", wall: `radial-gradient(rgba(30,120,90,.12) 1px, transparent 1.5px) 0 0/12px 12px, #dff3ea`, hl: "#ffd36b", n1: "#ffb3c7", n2: "#fff3a0", water: "#c8ece4", mirror: true },
  { name: "interesting · blueprint", wall: "linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px) 0 0/54px 54px, linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px) 0 0/54px 54px, radial-gradient(ellipse at 50% 40%, #2563a8, #173f73)", title: "#ffffff", hl: "#ffd27a", n1: "#ffd27a", n2: "#9fd3ff", water: "#c9def5" },
  { name: "interesting · chalkboard", wall: "radial-gradient(ellipse at 40% 30%, #3a5f4f 0%, #1f3a2e 85%)", title: "#f4f4ee", hl: "#ff8fb3", n1: "#fff3a0", n2: "#ffd0a0", water: "#bfe0d3", mirror: true },
];
const tm = /^#c(\d+)$/.exec(location.hash);
const TH = { ...BASE, ...THEMES[(tm ? Math.min(20, Math.max(1, +tm[1])) : 1) - 1] };
if (TH.deco) document.getElementById("pg").insertAdjacentHTML("afterbegin", `<div style="position:absolute;inset:0;overflow:hidden">${TH.deco}</div>`);
{ const pg = document.getElementById("pg").style; Object.entries({ "--wall": TH.wall, "--title": TH.title, "--hl": TH.hl, "--hlInk": TH.hlInk || "#262a33", "--tape1": TH.tape1, "--tape2": TH.tape2, "--pp": TH.pp, "--rc": TH.rc }).forEach(([k, v]) => pg.setProperty(k, v)); }

/* ---------- data, as of Dec 20, 2026 (posting day): every flight flown ---------- */
const AP = { SEA:{lon:-122.309,lat:47.449,city:"Seattle"}, SFO:{lon:-122.375,lat:37.619,city:"San Francisco"}, SJC:{lon:-121.929,lat:37.363,city:"San José"}, DFW:{lon:-97.040,lat:32.899,city:"Dallas"} };
const NAME = { DL:"Delta", UA:"United", WN:"Southwest", AS:"Alaska", F9:"Frontier", AA:"American" };
const LINE = { DL:"#E3132C", UA:"#0B2A7A", WN:"#F5A800", AS:"#1FA0C0", F9:"#2E8B57", AA:"#0078D2" };
const F = [["01-02","SEA","SJC","WN"],["06-12","SFO","SEA","UA"],["06-23","SEA","SJC","AS"],["06-30","SFO","SEA","UA"],["07-07","SEA","SJC","DL"],["08-14","SFO","DFW","F9"],["08-17","DFW","SFO","AA"],["09-05","SJC","SEA","DL"],["09-10","SEA","SJC","DL"],["11-14","SFO","SEA","AS"],["11-16","SEA","SFO","UA"],["11-23","SJC","SEA","WN"],["12-01","SEA","SJC","DL"],["12-19","SJC","SEA","WN"]];
const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function miles(a,b){const r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r,h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*3958.8*Math.asin(Math.sqrt(h));}
const fl = F.map(([md,from,to,air],i)=>{const [m,d]=md.split("-").map(Number);return{i,m:m-1,d,from,to,air,mi:miles(AP[from],AP[to]),key:[from,to].sort().join("-")};});
const nf = n => Math.round(n).toLocaleString("en-US");
const pad = n => String(n).padStart(2,"0");
const TOTAL = fl.reduce((s,f)=>s+f.mi,0);
const counts = Object.keys(NAME).map(c=>[c, fl.filter(f=>f.air===c).length]).sort((a,b)=>b[1]-a[1]);

/* ---------- map legend: logo, count, and the line color it uses ---------- */
document.getElementById("legend").innerHTML = counts.map(([c,n]) => `<div><span>${LOGO_PILL(c, 40, 118)}<span class="sw" style="background:${LINE[c]}"></span></span>×${n}</div>`).join("");

/* ---------- sticky notes ---------- */
const longest = fl.reduce((a,b) => b.mi > a.mi ? b : a);
document.getElementById("pg").insertAdjacentHTML("beforeend", `
  <div class="note" style="top:200px;left:790px;width:250px;background:${TH.n1};transform:rotate(5deg)"><span class="pin" style="top:-12px;left:120px"></span><b>total</b><div>${fl.length} flights</div><div>${nf(TOTAL)} miles</div><div>6 airlines</div></div>
  <div class="note" style="top:430px;left:650px;width:320px;background:${TH.n2};transform:rotate(3deg)"><span class="pin" style="top:-12px;left:150px;background:radial-gradient(circle at 35% 35%,#8ab4ff,#2b4c8c 60%)"></span><b>longest trip</b><div>${longest.from} → ${longest.to}</div><div>${nf(longest.mi)} mi each way</div></div>`);

/* ---------- passport stamps ---------- */
(function () {
  const inks = ["#6b2fa0","#b3202a","#1d6b3a","#1f4fa3","#b8641a","#0e7c86"];
  const items = fl.map(f => ({ f })).concat([{ total: true }]);
  document.getElementById("passport").insertAdjacentHTML("beforeend", items.map((it, k) => {
    const col = k % 3, row = Math.floor(k / 3);
    const x = 14 + col * 178 + ((k * 37) % 26) - 13, y = 78 + row * 164 + ((k * 53) % 30) - 15, rot = ((k * 47) % 30) - 15;
    const ink = it.total ? "#1f4fa3" : inks[k % inks.length], shape = it.total ? 0 : k % 3;
    const box = shape === 0 ? "width:168px;height:168px;border-radius:50%;border:5px double" : shape === 1 ? "width:184px;height:132px;border-radius:8px;border:5px double" : "width:190px;height:136px;border-radius:50%;border:4px solid";
    const body = it.total ? `<small>ENTRIES</small><b>${fl.length}</b><small>${nf(TOTAL)} MI</small>`
      : `<small>ARRIVED</small><b>${it.f.to}</b><small>${pad(it.f.d)} ${MON[it.f.m]} 2026</small><small>${NAME[it.f.air].toUpperCase()}</small>`;
    return `<div class="st" style="left:${x}px;top:${y}px;${box} ${ink};color:${ink};transform:rotate(${rot}deg)"><div>${body}</div></div>`;
  }).join(""));
})();

/* ---------- receipt ---------- */
(function () {
  let h = 0, bars = ""; for (const ch of "flightlog2026") h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  for (let i = 0; i < 60; i++) { h = (h * 1103515245 + 12345) >>> 0; bars += `<i style="display:inline-block;height:100%;margin-right:3px;background:#232323;width:${1 + (h >>> 28) % 4}px"></i>`; }
  document.getElementById("receipt").innerHTML = `
    <h2>FLIGHT LOG</h2><div class="c">2026 · ITEMIZED · TINGYUN</div><div class="hr"></div>
    ${fl.map(f => `<div class="it"><span>${pad(f.m+1)}/${pad(f.d)}</span><span>${f.from}→${f.to}</span>${LOGO_PILL(f.air, 28, 76, "box-shadow:none")}<span>${nf(f.mi)}</span></div>`).join("")}
    <div class="hr"></div><div class="tot"><span>TOTAL MI</span><span>${nf(TOTAL)}</span></div>
    <div class="sub" style="margin-top:6px"><span>FLIGHTS</span><span>${fl.length}</span></div><div class="sub"><span>AIRLINES</span><span>6</span></div><div class="sub"><span>AIRPORTS</span><span>4</span></div>
    <div class="bc">${bars}</div><div class="c" style="color:#232323">THANK YOU FOR FLYING</div>`;
})();


/* ---------- fun extras: doodles, a starburst sticker, handwritten notes on the map ---------- */
const O = 'stroke="#262a33" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
const face = (x,y,k=1) => `<g transform="translate(${x} ${y}) scale(${k})"><circle cx="-8" cy="0" r="3" fill="#262a33"/><circle cx="8" cy="0" r="3" fill="#262a33"/><path d="M-6 7 q6 6 12 0" fill="none" ${O} stroke-width="3"/><circle cx="-15" cy="7" r="4" fill="#ff9fb4"/><circle cx="15" cy="7" r="4" fill="#ff9fb4"/></g>`;
const D = {
  plane: `<svg viewBox="0 0 220 120"><path d="M20 70 q0 -26 40 -26 h90 q40 0 52 26 q-12 22 -52 22 h-90 q-40 0 -40 -22z" fill="#fff" ${O}/><path d="M40 46 l-14 -30 h22 l26 30z" fill="#ff8fb3" ${O}/><path d="M95 78 l-24 36 h26 l34 -36z" fill="#9fd3ff" ${O}/><circle cx="95" cy="62" r="7" fill="#9fd3ff" ${O} stroke-width="3"/><circle cx="120" cy="62" r="7" fill="#9fd3ff" ${O} stroke-width="3"/><circle cx="145" cy="62" r="7" fill="#9fd3ff" ${O} stroke-width="3"/>${face(178,66,.8)}<path d="M8 60 h-8 M10 74 h-10 M14 88 h-8" ${O} stroke-width="3" stroke-dasharray="2 6"/></svg>`,
  cloud: `<svg viewBox="0 0 160 100"><path d="M30 80 a24 24 0 0 1 4 -46 a32 32 0 0 1 60 -10 a26 26 0 0 1 40 26 a20 20 0 0 1 -6 30z" fill="#bfe3ff" ${O}/>${face(80,56)}</svg>`,
  star: `<svg viewBox="0 0 60 60"><path d="M30 6 l7 16 17 2 -13 11 4 17 -15 -9 -15 9 4 -17 -13 -11 17 -2z" fill="#ffd34d" ${O} stroke-width="3"/></svg>`,
  heart: `<svg viewBox="0 0 60 56"><path d="M30 50 C12 38 4 28 4 18 C4 9 11 4 18 4 C24 4 28 8 30 12 C32 8 36 4 42 4 C49 4 56 9 56 18 C56 28 48 38 30 50 Z" fill="#ff6b8b" ${O} stroke-width="3"/></svg>`,
  suitcase: `<svg viewBox="0 0 120 150"><rect x="20" y="34" width="80" height="100" rx="14" fill="#ffd34d" ${O}/><path d="M44 34 v-16 h32 v16" fill="none" ${O}/><circle cx="38" cy="140" r="7" fill="#262a33"/><circle cx="82" cy="140" r="7" fill="#262a33"/>${face(60,84)}</svg>`,
};
const place = (k, x, y, w, r = 0) => `<div class="doodle" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${r}deg)">${D[k]}</div>`;
let pts = "", N = 18; for (let k = 0; k < N * 2; k++) { const a = k / (N * 2) * Math.PI * 2, rr = k % 2 ? 62 : 80; pts += `${(90 + Math.cos(a) * rr).toFixed(1)},${(90 + Math.sin(a) * rr).toFixed(1)} `; }
document.getElementById("pg").insertAdjacentHTML("beforeend",
  place("plane", 610, 138, 170, -8) + place("star", 40, 30, 46, -10) + place("star", 690, 150, 34, 20) + place("cloud", 905, 92, 130, 6) +
  place("heart", 985, 640, 48, 14) + place("suitcase", 520, 1800, 82, -10) + place("star", 1010, 1870, 40) +
  `<div class="burst" style="left:925px;top:925px;width:150px;transform:rotate(12deg)"><svg viewBox="0 0 180 180"><polygon points="${pts}" fill="#ff6b8b" stroke="#262a33" stroke-width="4" stroke-linejoin="round"/><text x="90" y="86" text-anchor="middle" font-family="Permanent Marker" font-size="52" fill="#fff">14</text><text x="90" y="118" text-anchor="middle" font-family="Permanent Marker" font-size="26" fill="#fff">flights!</text></svg></div>`);

/* ---------- mirrored layout: receipt on the left, passport on the right ---------- */
if (TH.cards) document.querySelectorAll(".mapcard, .passport, #receipt").forEach(el => el.style.cssText += ";" + TH.cards);
if (TH.mirror) {
  const pp = document.querySelector(".passport"), rc = document.getElementById("receipt"), tapes = document.querySelectorAll(".tape"), burst = document.querySelector(".burst");
  pp.style.left = "486px"; pp.style.transform = "rotate(3deg)";
  rc.style.left = "30px"; rc.style.transform = "rotate(-2.5deg)";
  tapes[0].style.left = "660px"; tapes[1].style.left = "170px";
  if (burst) { burst.style.left = "395px"; burst.style.transform = "rotate(-12deg)"; }
}

/* ---------- map: real coastlines, one line per flight in its airline's color ---------- */
document.fonts.ready.then(() => {
  const W = 964, H = 560, svg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);
  const proj = d3.geoConicConformal().parallels([33,45]).rotate([110,0])
    .fitExtent([[14,14],[W-14,H-14]], { type:"MultiPoint", coordinates:[[-126.5,31.3],[-94,31.3],[-94,49.2],[-126.5,49.2]] });
  const path = d3.geoPath(proj);
  svg.append("rect").attr("width", W).attr("height", H).attr("fill", TH.water);
  svg.append("g").selectAll("path").data(topojson.feature(WORLD, WORLD.objects.countries).features).join("path")
    .attr("d", path).attr("fill", d => d.id === "840" ? TH.land : TH.land2).attr("stroke", "#c9c4b4").attr("stroke-width", 1);
  svg.append("path").attr("d", path(topojson.mesh(US, US.objects.states, (a,b) => a !== b))).attr("fill","none").attr("stroke","#d8d2c0").attr("stroke-width",1.3);
  const pt = c => proj([AP[c].lon, AP[c].lat]);
  const ROUTES = [{ key:"SEA-SJC", a:"SEA", b:"SJC", side:-1, k:.2 }, { key:"SEA-SFO", a:"SEA", b:"SFO", side:1, k:.2 }, { key:"DFW-SFO", a:"SFO", b:"DFW", side:-1, k:.22 }];
  ROUTES.forEach(r => {
    const rf = fl.filter(f => f.key === r.key), A = pt(r.a), B = pt(r.b), dx = B[0]-A[0], dy = B[1]-A[1], len = Math.hypot(dx, dy);
    const nx = -dy/len*r.side, ny = dx/len*r.side;
    rf.forEach((f, i) => {
      const kk = rf.length > 1 ? r.k * (.45 + 1.1 * i / (rf.length - 1)) : r.k;
      const d = `M${A} Q${(A[0]+B[0])/2 + nx*kk*len},${(A[1]+B[1])/2 + ny*kk*len} ${B}`;
      svg.append("path").attr("d", d).attr("fill","none").attr("stroke","#fff").attr("stroke-width",8).attr("stroke-linecap","round");
      svg.append("path").attr("d", d).attr("fill","none").attr("stroke", LINE[f.air]).attr("stroke-width",4.5).attr("stroke-linecap","round");
    });
  });
  const L = { SEA:[16,-14,"start"], SFO:[-16,-6,"end"], SJC:[16,28,"start"], DFW:[16,6,"start"] };
  Object.entries(AP).forEach(([c,a]) => {
    const [x,y] = pt(c);
    svg.append("circle").attr("cx",x).attr("cy",y).attr("r",10).attr("fill","#fff").attr("stroke","#262a33").attr("stroke-width",4);
    const t = svg.append("text").attr("x", x+L[c][0]).attr("y", y+L[c][1]).attr("text-anchor", L[c][2]).attr("fill","#262a33").attr("paint-order","stroke").attr("stroke","rgba(255,255,255,.85)").attr("stroke-width",5);
    t.append("tspan").attr("font-family","Caveat").attr("font-weight",700).attr("font-size",48).text(c);
    t.append("tspan").attr("x", x+L[c][0]).attr("dy", 26).attr("font-family","Caveat").attr("font-size",26).text(a.city);
  });
  // handwritten notes with arrows
  const note = (x, y, txt, ax, ay, rot = -4) => {
    svg.append("text").attr("x", x).attr("y", y).attr("transform", `rotate(${rot} ${x} ${y})`).attr("font-family", "Caveat").attr("font-weight", 700).attr("font-size", 38).attr("fill", "#d63a3a").text(txt);
    svg.append("path").attr("d", `M${x - 10},${y - 10} Q${(x + ax) / 2 - 20},${Math.min(y, ay) - 40} ${ax},${ay}`).attr("fill", "none").attr("stroke", "#d63a3a").attr("stroke-width", 3.5).attr("stroke-linecap", "round").attr("marker-end", "url(#ah)");
  };
  const mk = svg.append("defs").append("marker").attr("id", "ah").attr("viewBox", "0 0 10 10").attr("refX", 8).attr("refY", 5).attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto");
  mk.append("path").attr("d", "M0,0 L10,5 L0,10 z").attr("fill", "#d63a3a");
  const sea = pt("SEA"), sjc = pt("SJC"), dfw = pt("DFW"), sfo = pt("SFO");
  note(sea[0] + 70, sea[1] + 165, "8× SEA ⇄ SJC!", sea[0] + 52, (sea[1] + sjc[1]) / 2 - 30, -6);
  { const mx = (sfo[0] + dfw[0]) / 2, my = (sfo[1] + dfw[1]) / 2; svg.append("text").attr("x", mx - 150).attr("y", my + 110).attr("transform", `rotate(-3 ${mx - 150} ${my + 110})`).attr("font-family", "Caveat").attr("font-weight", 700).attr("font-size", 38).attr("fill", "#d63a3a").text("the long one: Dallas!");
    svg.append("path").attr("d", `M${mx - 40},${my + 78} Q${mx - 30},${my + 50} ${mx - 10},${my + 22}`).attr("fill", "none").attr("stroke", "#d63a3a").attr("stroke-width", 3.5).attr("stroke-linecap", "round").attr("marker-end", "url(#ah)"); }
});
</script>
</body>
</html>
