<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2026 Flights · Themes</title>

<style>
/* Shared 1080×1920 layout: header, real US map with three labeled routes, airline row, flight list. Each theme (#t1…#t20) only restyles it. */
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
.pg { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--bf); }
.deco { position: absolute; inset: 0; pointer-events: none; }
.hd { position: absolute; top: 96px; left: 80px; right: 80px; }
.hd h1 { font: var(--tw, 700) var(--ts, 130px)/0.9 var(--tf); white-space: nowrap; }
.hd h1 em { font-style: normal; color: var(--acc); }
.hd p { margin-top: 18px; font: 400 var(--ss, 30px)/1.2 var(--sf, var(--lf)); color: var(--mute); letter-spacing: var(--sls, 0); }

.mapbox { position: absolute; top: 300px; left: 0; width: 1080px; height: 820px; }
.mapbox svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.state { fill: var(--land); stroke: var(--border); stroke-width: 1.4; }
.state.hi { fill: var(--landHi); }
.route { fill: none; stroke-linecap: round; }
.apt { fill: #fff; stroke: var(--ink); stroke-width: 4; }
.aptl { font: 700 var(--as, 38px) var(--af, var(--tf)); fill: var(--ink); }
.aptc { font: 400 22px var(--lf); fill: var(--mute); }
.call { position: absolute; background: var(--cbg); color: var(--cfg); border: var(--cbw, 3px) solid var(--rc); border-radius: var(--rad, 14px); padding: 12px 16px 14px; box-shadow: var(--csh, 0 8px 22px rgba(0,0,0,.14)); font-family: var(--lf); white-space: nowrap; }
.call b { display: block; font: 700 var(--cts, 34px)/1 var(--cf, var(--tf)); color: var(--rc2, var(--rc)); }
.call small { display: block; font-size: var(--cs, 20px); margin: 6px 0 10px; opacity: .8; }
.call .bs { display: flex; gap: 8px; }
.al { position: relative; display: inline-grid; place-items: center; width: 50px; height: 34px; border-radius: 7px; font: 500 17px "IBM Plex Mono", monospace; color: #fff; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.al sup { position: absolute; top: -10px; right: -8px; min-width: 22px; height: 22px; border-radius: 11px; background: #111; color: #fff; font: 700 14px/22px "IBM Plex Mono"; text-align: center; padding: 0 4px; }

.airl { position: absolute; top: 1160px; left: 80px; right: 80px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 24px; font: 400 30px var(--lf); }
.airl div { display: flex; align-items: center; gap: 10px; }
.airl span:last-child { color: var(--ink); font-size: 30px; font-weight: 700; }

.list { position: absolute; top: 1320px; left: 80px; right: 80px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 44px; }
.cnt { position: absolute; top: -9px; right: -9px; min-width: 22px; height: 22px; border-radius: 11px; background: #111; color: #fff; font: 700 14px/22px "IBM Plex Mono"; text-align: center; padding: 0 4px; }
.row { display: grid; grid-template-columns: 86px 136px 1fr auto; align-items: center; height: 66px; font: 400 var(--rs, 30px) var(--lf); border-top: var(--rb, 1px solid transparent); white-space: nowrap; }
.row .d { color: var(--mute); font-size: .8em; }
.row .r i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
.row .t { font-size: 18px; color: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
.row.up .r { color: var(--mute); }
</style>
</head>

<script>
/* ---------- data ---------- */
const AP = { SEA:{lon:-122.309,lat:47.449,city:"Seattle"}, SFO:{lon:-122.375,lat:37.619,city:"San Francisco"}, SJC:{lon:-121.929,lat:37.363,city:"San José"}, DFW:{lon:-97.040,lat:32.899,city:"Dallas–Fort Worth"} };
const AL = {
  DL:{name:"Delta",bg:"#C8102E"}, UA:{name:"United",bg:"#0033A0"},
  WN:{name:"Southwest",bg:"linear-gradient(#304CB2 0 66%, #FFBF27 66% 83%, #C60C30 83%)"},
  AS:{name:"Alaska",bg:"linear-gradient(#01426A 0 76%, #48A9C5 76%)"},
  F9:{name:"Frontier",bg:"#00764F"}, AA:{name:"American",bg:"linear-gradient(#0078D2 0 76%, #C30019 76%)"},
};
const F = [["01-02","SEA","SJC","WN"],["06-12","SFO","SEA","UA"],["06-23","SEA","SJC","AS"],["06-30","SFO","SEA","UA"],["07-07","SEA","SJC","DL"],["08-14","SFO","DFW","F9"],["08-17","DFW","SFO","AA"],["09-05","SJC","SEA","DL"],["09-10","SEA","SJC","DL"],["11-14","SFO","SEA","AS"],["11-16","SEA","SFO","UA"],["11-23","SJC","SEA","WN"],["12-01","SEA","SJC","DL"],["12-19","SJC","SEA","WN"]];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// "#t15-final" renders as of Dec 20, 2026 (the planned posting day), when every flight has been flown.
const today = /-final$/.test(location.hash) ? new Date(2026, 11, 20) : (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
function miles(a,b){const r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r,h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*3958.8*Math.asin(Math.sqrt(h));}
const fl = F.map(([md,from,to,air])=>{const [m,d]=md.split("-").map(Number);const date=new Date(2026,m-1,d);return{m:m-1,d,from,to,air,date,up:date>=today,mi:miles(AP[from],AP[to]),key:[from,to].sort().join("-")};});
const TOTAL = Math.round(fl.reduce((s,f)=>s+f.mi,0)).toLocaleString("en-US");
const pad = n => String(n).padStart(2,"0");
const LINE = { DL:"#E3132C", UA:"#0B2A7A", WN:"#F5A800", AS:"#1FA0C0", F9:"#2E8B57", AA:"#0078D2" }; // one line color per airline
const badge = (c, n, h = 40, w = 124) => LOGO_PILL(c, h, w).replace(/<\/span>$/, (n ? `<sup class="cnt">${n}</sup>` : "") + "</span>");
// The three routes, each drawn once. side: which way the arc bulges (1 = left of travel direction).
const ROUTES = [
  { key:"SEA-SJC", a:"SEA", b:"SJC", label:"SEA ⇄ SJC", side:-1, k:.2,  ci:0, at:"east" },
  { key:"SEA-SFO", a:"SEA", b:"SFO", label:"SEA ⇄ SFO", side: 1, k:.2,  ci:1, at:"sw" },
  { key:"DFW-SFO", a:"SFO", b:"DFW", label:"SFO ⇄ DFW", side:-1, k:.22, ci:2, at:"south" },
];
ROUTES.forEach(r => { r.fl = fl.filter(f => f.key === r.key); });
const counts = Object.keys(AL).map(c => [c, fl.filter(f => f.air === c).length]).sort((a,b) => b[1]-a[1]);

/* ---------- themes ---------- */
// vars: CSS custom properties. r: three route colors. rough: hand-drawn wobble. css/deco/title: extra styling.
const T = [];

  deco:`<div style="position:absolute;top:0;bottom:0;left:56px;width:3px;background:#ef9aa3"></div>`, title:`2026 <em>in the air ✈</em>` });

  css:`.row .r{background:#151515;color:#eee;padding:8px 14px 5px;border-radius:4px;justify-self:start;letter-spacing:.08em}.row.up .r{background:#b3202a;color:#fff}`, title:`2026 <em>in the air</em>` });
T.push({ name:"bullet journal", rough:2, r:["#151515","#2fb88a","#e07a2f"], vars:{ ...hand, "--bg":"radial-gradient(#b9bdc4 2px, transparent 2.6px) 0 0/40px 40px, #fcfcfc", "--ink":"#151515", "--mute":"#6c6c6c", "--land":"rgba(0,0,0,.02)", "--landHi":"rgba(155,227,200,.45)", "--border":"#9aa0a8", "--acc":"#151515", "--cbg":"#fff", "--cfg":"#151515", "--ts":"150px" },
  css:`.hd h1 em{background:linear-gradient(transparent 58%,#9be3c8 58% 90%,transparent 90%)}`, title:`<em>2026</em> flight log` });

  deco:`<div style="position:absolute;top:40px;right:60px;width:170px;height:210px;border:3px dashed #c2343e;transform:rotate(4deg);display:grid;place-items:center;font:400 22px 'Special Elite';color:#c2343e;text-align:center">AIR MAIL<br>2026<br>✈</div><div style="position:absolute;top:40px;left:80px;font:400 26px 'Special Elite';letter-spacing:.5em;color:#8a8f9c">POST CARD</div>`, title:`greetings from <em>the air!</em>`, sub:`14 FLIGHTS · ${TOTAL} MI · 6 AIRLINES` });
T.push({ name:"sticky notes", rough:0, r:["#e0598b","#2f80d1","#e39b14"], vars:{ ...hand, "--bg":"#eceef1", "--ink":"#262a33", "--mute":"#6b7280", "--land":"#ffffff", "--landHi":"#fff6c4", "--border":"#cfd4dc", "--acc":"#e0598b", "--cbg":"#ffe680", "--cfg":"#262a33", "--cbw":"0px", "--rad":"2px", "--csh":"0 10px 18px rgba(30,30,50,.18)" },
  css:`.call{transform:rotate(-2deg)}.call:nth-of-type(2){background:#ffb3c7;transform:rotate(2deg)}.call:nth-of-type(3){background:#a8e6cf}.row{background:#fff6b0;margin:4px 0;height:54px;padding:0 10px;box-shadow:0 3px 6px rgba(0,0,0,.08)}.row:nth-child(even){background:#ffd6e2}`, title:`2026 <em>✈</em> flights` });
T.push({ name:"receipt", rough:0, r:["#232323","#7a7a7a","#c0392b"], vars:{ "--tf":"IBM Plex Mono", "--bf":"IBM Plex Mono", "--lf":"IBM Plex Mono", "--ts":"84px", "--tw":"700", "--as":"30px", "--cts":"26px", "--rs":"24px", "--bg":"#dfe3e8", "--ink":"#232323", "--mute":"#7a7a7a", "--land":"#f3f3f3", "--landHi":"#e4e4e4", "--border":"#bdbdbd", "--acc":"#232323", "--cbg":"#fff", "--cfg":"#232323", "--rad":"0px", "--cbw":"2px", "--rb":"2px dashed #cfcfcf", "--ss":"24px" },
  deco:`<div style="position:absolute;top:50px;bottom:50px;left:30px;right:30px;background:#fff;box-shadow:0 20px 40px rgba(20,30,50,.15)"></div>`, title:`FLIGHT LOG<br><em style="font-size:40px;font-weight:400">2026 · ITEMIZED RECEIPT</em>`, sub:`14 ITEMS · TOTAL ${TOTAL} MI` });
T.push({ name:"passport", rough:0, r:["#6b2fa0","#b3202a","#1d6b3a"], vars:{ "--tf":"Big Shoulders Display", "--bf":"Special Elite", "--lf":"Special Elite", "--tw":"900", "--ts":"130px", "--as":"40px", "--rs":"25px", "--bg":"repeating-radial-gradient(circle at 50% 42%, transparent 0 16px, rgba(40,100,90,.07) 16px 18px), #dfeae5", "--ink":"#24433d", "--mute":"#5f7c75", "--land":"rgba(255,255,255,.55)", "--landHi":"rgba(255,255,255,.9)", "--border":"#9fb8b0", "--acc":"#b3202a", "--cbg":"rgba(255,255,255,.6)", "--cfg":"#24433d", "--cbw":"5px", "--rad":"999px", "--csh":"none", "--ss":"24px", "--sls":".3em" },
  css:`.call{border-style:double;padding:18px 30px;transform:rotate(-6deg)}.call:nth-of-type(2){transform:rotate(5deg)}`, title:`VISAS <em>2026</em>`, sub:`ENTRIES 14 · ${TOTAL} MI` });
T.push({ name:"calendar", rough:2, r:["#e0413b","#2b4c8c","#f0962a"], vars:{ ...hand, "--bg":"#ffffff", "--ink":"#1e2533", "--mute":"#8a91a0", "--land":"#f5f6f8", "--landHi":"#ffe9e7", "--border":"#cdd2da", "--acc":"#e0413b", "--cbg":"#fff", "--cfg":"#1e2533" },

T.push({ name:"chalkboard", rough:5, r:["rgba(246,246,240,.95)","#ffd36b","#8fd3ff"], vars:{ ...hand, "--bg":"radial-gradient(ellipse at 40% 30%, #33594a 0%, #1d342a 80%)", "--ink":"rgba(246,246,240,.93)", "--mute":"rgba(246,246,240,.6)", "--land":"rgba(255,255,255,.03)", "--landHi":"rgba(255,255,255,.1)", "--border":"rgba(246,246,240,.3)", "--acc":"#ffd36b", "--cbg":"rgba(20,40,30,.6)", "--cfg":"rgba(246,246,240,.93)", "--csh":"none", "--ts":"170px" },
  deco:`<div style="position:absolute;inset:0;border:30px solid #7a4e2a"></div>`, title:`2026 <em>✈</em>` });
T.push({ name:"index cards", rough:2, r:["#24304a","#c46a1e","#2a9d6f"], vars:{ ...hand, "--bg":"#e4e8ec", "--ink":"#24304a", "--mute":"#6b7790", "--land":"#f6f8fb", "--landHi":"#e3ecf7", "--border":"#b9c6d8", "--acc":"#c46a1e", "--cbg":"#fff", "--cfg":"#24304a" },
  deco:`<div style="position:absolute;top:310px;left:24px;width:1032px;height:900px;background:#fff;transform:rotate(1deg);box-shadow:0 14px 26px rgba(30,40,60,.14)"></div><div style="position:absolute;top:290px;left:120px;width:180px;height:54px;background:rgba(140,205,190,.75);transform:rotate(-6deg)"></div><div style="position:absolute;top:290px;right:120px;width:180px;height:54px;background:rgba(255,200,90,.7);transform:rotate(5deg)"></div><div style="position:absolute;top:1205px;left:50px;width:980px;height:660px;background:repeating-linear-gradient(transparent 0 60px,#bfd5ec 60px 62px) 0 175px/100% 100% no-repeat,#fff;transform:rotate(-.8deg);box-shadow:0 14px 26px rgba(30,40,60,.14)"></div>`, title:`2026 <em>in the air</em>` });

const mini = (bg, ink, mute, land, landHi, border, extra={}) => ({ "--tf":"Instrument Serif", "--bf":"IBM Plex Mono", "--lf":"IBM Plex Mono", "--tw":"400", "--ts":"140px", "--rs":"24px", "--as":"28px", "--af":"IBM Plex Mono", "--cf":"Instrument Serif", "--cts":"36px", "--bg":bg, "--ink":ink, "--mute":mute, "--land":land, "--landHi":landHi, "--border":border, "--acc":mute, "--cbg":bg, "--cfg":ink, "--rad":"6px", "--cbw":"2px", "--csh":"none", "--rb":`1px solid ${border}`, "--ss":"24px", "--sls":".08em", ...extra });
T.push({ name:"dark minimal", r:["#eceef2","#9aa3b5","#e8b04b"], vars:mini("#0e0f12","#eceef2","#6d7380","#16181d","#20232a","#2a2d34"), title:`2026 <em>in the air</em>` });
T.push({ name:"light minimal", r:["#16181d","#6b7380","#c2410c"], vars:mini("#eef0f2","#16181d","#8b919c","#e3e6ea","#d6dbe1","#c9cdd4"), title:`2026 <em>in the air</em>` });
T.push({ name:"big numeral", r:["#141414","#8c8c8c","#2563eb"], vars:mini("#fafafa","#141414","#8c8c8c","#f0f0f0","#e3e3e3","#d4d4d4", {"--ts":"220px"}), css:`.hd{top:70px}.hd p{display:none}`, title:`14 <em style="font-style:italic;font-size:80px">flights in 2026</em>` });
T.push({ name:"swiss", r:["#111111","#e3261c","#8a8a8a"], vars:{ ...mini("#f6f6f4","#111","#777","#ebebe8","#dcdcd8","#c8c8c4"), "--tf":"Archivo", "--lf":"Archivo", "--af":"Archivo", "--cf":"Archivo", "--tw":"900", "--ts":"200px", "--rb":"2px solid #111", "--rs":"26px" },
  css:`.hd h1{letter-spacing:-.05em}.hd p{display:inline-block;background:#e3261c;color:#fff;padding:10px 18px;font-weight:700}`, title:`2026` });
T.push({ name:"blueprint", r:["#f2f6fb","#9fd0ff","#ffd27a"], vars:{ ...mini("linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px) 0 0/54px 54px, linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px) 0 0/54px 54px, radial-gradient(ellipse at 50% 40%, #2563a8, #173f73)","#f2f6fb","rgba(242,246,251,.65)","rgba(255,255,255,.05)","rgba(255,255,255,.14)","rgba(242,246,251,.35)", {"--cbg":"#1d4f8f","--rb":"1px solid rgba(255,255,255,.2)"}) }, title:`<i>Flights, 2026</i>` });
T.push({ name:"sage", r:["#2e3a2f","#3d6b4f","#b5653a"], vars:mini("#dde4da","#2e3a2f","#5d6e5f","#e9eee7","#cfdacb","#b9c5b6", {"--cbg":"#eef2ec"}), title:`A year <em><i>in the air</i></em>` });
T.push({ name:"warm paper", r:["#3a2f2a","#8a5a3c","#4a6fa5"], vars:mini("#f1ece4","#3a2f2a","#8b7f74","#e8e1d6","#dccfbd","#cdbfae", {"--cbg":"#f7f3ed"}), title:`2026, <em><i>by air</i></em>` });
T.push({ name:"bold type", r:["#111","#ff4d2e","#2a6ef0"], vars:{ ...mini("#ffffff","#111","#777","#f1f1f1","#e2e2e2","#cfcfcf"), "--tf":"Big Shoulders Display", "--af":"Big Shoulders Display", "--cf":"Big Shoulders Display", "--tw":"900", "--ts":"190px", "--as":"44px", "--cts":"40px" },
  css:`.hd h1 em{color:transparent;-webkit-text-stroke:3px #111}`, title:`2026 <em>FLIGHTS</em>` });

  deco: Array.from({length:90},(_,i)=>{const x=(i*137)%1080,y=(i*251)%1900,s=1+(i%3);return `<i style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:#fff;opacity:${.25+(i%5)*.12}"></i>`;}).join(""), title:`2026 <em><i>in the air</i></em>` });
T.push({ name:"departures", r:["#16181d","#2f80d1","#e0a020"], vars:{ ...mini("#e8e9eb","#16181d","#6c717b","#f4f5f6","#ffffff","#cfd2d7"), "--tf":"Archivo", "--af":"Archivo", "--cf":"Archivo", "--tw":"900", "--ts":"110px", "--cbg":"#fff", "--rb":"0", "--rs":"25px" },

/* ---------- render ---------- */
const m = /^#t(\d+)(-final)?$/.exec(location.hash);
const th = T[(m ? Math.min(T.length, Math.max(1, +m[1])) : 1) - 1];
const vars = Object.entries(th.vars).map(([k,v]) => `${k}:${v}`).join(";");
const routeColor = key => th.r[ROUTES.find(r => r.key === key).ci];

document.getElementById("root").innerHTML = `<style>${th.css || ""}</style>
<div class="pg" style="${vars}">
  <div class="deco">${th.deco || ""}</div>
  <div class="hd"><h1>${th.title}</h1><p>${th.sub || `${fl.length} flights · ${TOTAL} miles · 6 airlines · 4 airports`}</p></div>
  <div class="mapbox" id="mapbox"><svg id="map"></svg></div>
  <div class="airl">${counts.map(([c,n]) => `<div>${badge(c, 0, 54, 200)}<span>×${n}</span></div>`).join("")}</div>
  <div class="list">${[fl.slice(0,7), fl.slice(7)].map(col => `<div>${col.map(f => `<div class="row${f.up ? " up" : ""}"><span class="d">${MON[f.m]} ${f.d}</span>${badge(f.air)}<span class="r"><i style="background:${LINE[f.air]}"></i>${f.from} → ${f.to}</span><span class="t">${f.up ? "soon" : ""}</span></div>`).join("")}</div>`).join("")}</div>
</div>`;

/* ---------- map (after fonts load, so labels measure correctly) ---------- */
document.fonts.ready.then(() => {
const W = 1080, H = 820;
const svg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);
const proj = d3.geoConicConformal().parallels([33, 45]).rotate([110, 0])
  .fitExtent([[10, 10], [W - 10, H - 10]], { type: "MultiPoint", coordinates: [[-127.6, 31.2], [-93.6, 31.2], [-93.6, 49.3], [-127.6, 49.3], [-110, 49.3]] });
// pin the map to the top of its box
{ const ys = [[-127.6, 49.3], [-110, 49.3], [-93.6, 49.3]].map(c => proj(c)[1]); const t = proj.translate(); proj.translate([t[0], t[1] - (Math.min(...ys) - 14)]); }
const path = d3.geoPath(proj);
const defs = svg.append("defs");
if (th.rough) {
  const f = defs.append("filter").attr("id", "rough");
  f.append("feTurbulence").attr("type", "fractalNoise").attr("baseFrequency", .03).attr("numOctaves", 2).attr("seed", 7);
  f.append("feDisplacementMap").attr("in", "SourceGraphic").attr("scale", th.rough);
}
const states = topojson.feature(US, US.objects.states).features.filter(s => !["02","15","72","78","60","66","69"].includes(s.id));
const HI = ["53", "06", "48"]; // Washington, California, Texas
svg.append("g").attr("filter", th.rough ? "url(#rough)" : null).selectAll("path").data(states).join("path")
  .attr("class", d => "state" + (HI.includes(d.id) ? " hi" : "")).attr("d", path);

const pt = c => proj([AP[c].lon, AP[c].lat]);
const box = document.getElementById("mapbox");
ROUTES.forEach(r => {
  const A = pt(r.a), B = pt(r.b), dx = B[0]-A[0], dy = B[1]-A[1], len = Math.hypot(dx, dy);
  const nx = -dy/len * r.side, ny = dx/len * r.side;
  const C = [(A[0]+B[0])/2 + nx*r.k*len, (A[1]+B[1])/2 + ny*r.k*len];
  const col = "var(--ink)";
  // one line per flight in its airline's color, fanned out so each stays visible
  r.fl.forEach((f, i) => {
    const kk = r.fl.length > 1 ? r.k * (.45 + 1.1 * i / (r.fl.length - 1)) : r.k;
    const Ci = [(A[0]+B[0])/2 + nx*kk*len, (A[1]+B[1])/2 + ny*kk*len];
    const d = `M${A} Q${Ci} ${B}`;
    svg.append("path").attr("class", "route").attr("d", d).attr("stroke", "#fff").attr("stroke-width", 8).attr("opacity", .85).attr("filter", th.rough ? "url(#rough)" : null);
    svg.append("path").attr("class", "route").attr("d", d).attr("stroke", LINE[f.air]).attr("stroke-width", 4.5).attr("filter", th.rough ? "url(#rough)" : null);
  });
  // callout next to the arc's middle
  const M = [.25*A[0] + .5*C[0] + .25*B[0], .25*A[1] + .5*C[1] + .25*B[1]];
  const flown = r.fl.filter(f => !f.up).length, booked = r.fl.length - flown;
  const airs = {}; r.fl.forEach(f => airs[f.air] = (airs[f.air] || 0) + 1);
  const el = document.createElement("div");
  el.className = "call"; el.style.setProperty("--rc", col);
  el.innerHTML = `<b>${r.label}</b><small>${r.fl.length} ${r.fl.length === 1 ? "flight" : "flights"}${booked ? ` · ${flown} flown · ${booked} booked` : ""}</small><div class="bs">${Object.entries(airs).sort((a,b)=>b[1]-a[1]).map(([c,n]) => badge(c, n > 1 ? n : 0, 36, 112)).join("")}</div>`;
  box.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  let x, y, ax, ay;
  if (r.at === "sw") { const S = pt("SFO"); x = 24; y = S[1] + 80; }
  else if (r.at === "east") { x = M[0] + 70; y = M[1] - h / 2 - 50; }
  else { x = M[0] - w / 2 - 40; y = M[1] + 70; }
  x = Math.max(10, Math.min(W - w - 10, x)); y = Math.max(10, Math.min(H - h - 10, y));
  el.style.left = x + "px"; el.style.top = y + "px";
  // thin leader from the callout to the middle of its route
  ax = Math.max(x, Math.min(x + w, M[0])); ay = Math.max(y, Math.min(y + h, M[1]));
  svg.insert("line", ".route").attr("x1", ax).attr("y1", ay).attr("x2", M[0]).attr("y2", M[1]).attr("stroke", col).attr("stroke-width", 2).attr("stroke-dasharray", "3 5").attr("opacity", .6);
  
});
Object.entries(AP).forEach(([c, a]) => {
  const [x, y] = pt(c);
  svg.append("circle").attr("class", "apt").attr("cx", x).attr("cy", y).attr("r", 10);
  const L = { SEA:[18,-14,"start"], SFO:[-20,-4,"end"], SJC:[18,30,"start"], DFW:[-18,40,"end"] }[c];
  const t = svg.append("text").attr("x", x + L[0]).attr("y", y + L[1]).attr("text-anchor", L[2]);
  t.append("tspan").attr("class", "aptl").text(c);
  t.append("tspan").attr("class", "aptc").attr("x", x + L[0]).attr("dy", 26).text(a.city);
});
});
</script>
</body>
</html>
