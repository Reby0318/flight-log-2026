const fl = F.map(([md,from,to,air],i)=>{const [m,d]=md.split("-").map(Number);return{i,m:m-1,d,from,to,air,mi:miles(AP[from],AP[to]),key:[from,to].sort().join("-")};});
const nf = n => Math.round(n).toLocaleString("en-US");
const pad = n => String(n).padStart(2,"0");
const TOTAL = fl.reduce((s,f)=>s+f.mi,0);
const counts = Object.keys(NAME).map(c=>[c, fl.filter(f=>f.air===c).length]).sort((a,b)=>b[1]-a[1]);

/* ---------- passport stamps ---------- */
(function () {
  const inks = ["#6b2fa0","#b3202a","#1d6b3a","#1f4fa3","#b8641a","#0e7c86"];
  const items = fl.map(f => ({ f })).concat([{ total: true }]);
  document.getElementById("passport").insertAdjacentHTML("beforeend", items.map((it, k) => {
    const col = k % 3, row = Math.floor(k / 3);
    const x = 14 + col * 178 + ((k * 37) % 26) - 13, y = 78 + row * 164 + ((k * 53) % 30) - 15, rot = ((k * 47) % 30) - 15;
    const ink = it.total ? "#1f4fa3" : inks[k % inks.length], shape = it.total ? 0 : k % 3;
    const box = shape === 0 ? "width:168px;height:168px;border-radius:50%;border:5px double" : shape === 1 ? "width:184px;height:132px;border-radius:8px;border:5px double" : "width:190px;height:136px;border-radius:50%;border:4px solid";
    const body = it.total ? `<small>ENTRIES</small><b>${fl.length}</b><small>${nf(TOTAL)} MI</small>`
      : `<small>ARRIVED</small><b>${it.f.to}</b><small>${pad(it.f.d)} ${MON[it.f.m]} 2026</small><small>${NAME[it.f.air].toUpperCase()}</small>`;
    return `<div class="st" style="left:${x}px;top:${y}px;${box} ${ink};color:${ink};transform:rotate(${rot}deg)"><div>${body}</div></div>`;
  }).join(""));
})();

/* ---------- map: real coastlines, one line per flight in its airline's color ---------- */
document.fonts.ready.then(() => {
  const W = 964, H = 486, svg = d3.select("#map").attr("viewBox", `0 0 ${W} ${H}`);
  const proj = d3.geoConicConformal().parallels([33,45]).rotate([110,0])
    .fitExtent([[14,14],[W-14,H-14]], { type:"MultiPoint", coordinates:[[-126.5,31.3],[-94,31.3],[-94,49.2],[-126.5,49.2]] });
  const path = d3.geoPath(proj);
  svg.append("rect").attr("width", W).attr("height", H).attr("fill", TH.water);
  svg.append("g").selectAll("path").data(topojson.feature(WORLD, WORLD.objects.countries).features).join("path")
    .attr("d", path).attr("fill", d => d.id === "840" ? TH.land : TH.land2).attr("stroke", "#c9c4b4").attr("stroke-width", 1);
  svg.append("path").attr("d", path(topojson.mesh(US, US.objects.states, (a,b) => a !== b))).attr("fill","none").attr("stroke","#d8d2c0").attr("stroke-width",1.3);
  const pt = c => proj([AP[c].lon, AP[c].lat]);
  const ROUTES = [{ key:"SEA-SJC", a:"SEA", b:"SJC", side:-1, k:.2 }, { key:"SEA-SFO", a:"SEA", b:"SFO", side:1, k:.2 }, { key:"DFW-SFO", a:"SFO", b:"DFW", side:-1, k:.22 }];
  ROUTES.forEach(r => {
    const rf = fl.filter(f => f.key === r.key), A = pt(r.a), B = pt(r.b), dx = B[0]-A[0], dy = B[1]-A[1], len = Math.hypot(dx, dy);
    const nx = -dy/len*r.side, ny = dx/len*r.side;
    rf.forEach((f, i) => {
      const kk = rf.length > 1 ? r.k * (.45 + 1.1 * i / (rf.length - 1)) : r.k;
      const d = `M${A} Q${(A[0]+B[0])/2 + nx*kk*len},${(A[1]+B[1])/2 + ny*kk*len} ${B}`;
      svg.append("path").attr("d", d).attr("fill","none").attr("stroke","#fff").attr("stroke-width",8).attr("stroke-linecap","round");
      svg.append("path").attr("d", d).attr("fill","none").attr("stroke", LINE[f.air]).attr("stroke-width",4.5).attr("stroke-linecap","round");
    });
  });
  const L = { SEA:[16,-14,"start"], SFO:[-16,-6,"end"], SJC:[16,28,"start"], DFW:[16,6,"start"] };
  Object.entries(AP).forEach(([c,a]) => {
    const [x,y] = pt(c);
    svg.append("circle").attr("cx",x).attr("cy",y).attr("r",10).attr("fill","#fff").attr("stroke","#262a33").attr("stroke-width",4);
    const t = svg.append("text").attr("x", x+L[c][0]).attr("y", y+L[c][1]).attr("text-anchor", L[c][2]).attr("fill","#262a33").attr("paint-order","stroke").attr("stroke","rgba(255,255,255,.85)").attr("stroke-width",5);
    t.append("tspan").attr("font-family","Caveat").attr("font-weight",700).attr("font-size",48).text(c);
    t.append("tspan").attr("x", x+L[c][0]).attr("dy", 26).attr("font-family","Caveat").attr("font-size",26).text(a.city);
  });
  // handwritten notes with arrows
  const note = (x, y, txt, ax, ay, rot = -4) => {
    svg.append("text").attr("x", x).attr("y", y).attr("transform", `rotate(${rot} ${x} ${y})`).attr("font-family", "Caveat").attr("font-weight", 700).attr("font-size", 38).attr("fill", "#d63a3a").text(txt);
    svg.append("path").attr("d", `M${x - 10},${y - 10} Q${(x + ax) / 2 - 20},${Math.min(y, ay) - 40} ${ax},${ay}`).attr("fill", "none").attr("stroke", "#d63a3a").attr("stroke-width", 3.5).attr("stroke-linecap", "round").attr("marker-end", "url(#ah)");
  };
  const mk = svg.append("defs").append("marker").attr("id", "ah").attr("viewBox", "0 0 10 10").attr("refX", 8).attr("refY", 5).attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto");
  mk.append("path").attr("d", "M0,0 L10,5 L0,10 z").attr("fill", "#d63a3a");
  const sea = pt("SEA"), sjc = pt("SJC"), dfw = pt("DFW"), sfo = pt("SFO");
  note(sea[0] + 70, sea[1] + 165, "8× SEA ⇄ SJC!", sea[0] + 52, (sea[1] + sjc[1]) / 2 - 30, -6);
  { const mx = (sfo[0] + dfw[0]) / 2, my = (sfo[1] + dfw[1]) / 2; svg.append("text").attr("x", mx - 150).attr("y", my + 110).attr("transform", `rotate(-3 ${mx - 150} ${my + 110})`).attr("font-family", "Caveat").attr("font-weight", 700).attr("font-size", 38).attr("fill", "#d63a3a").text("the long one: Dallas!");
    svg.append("path").attr("d", `M${mx - 40},${my + 78} Q${mx - 30},${my + 50} ${mx - 10},${my + 22}`).attr("fill", "none").attr("stroke", "#d63a3a").attr("stroke-width", 3.5).attr("stroke-linecap", "round").attr("marker-end", "url(#ah)"); }
});
</script>
</body>
</html>
