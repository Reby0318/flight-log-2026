<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2026 Flights · Variants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&family=Special+Elite&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;700&family=Archivo:wght@400;700;900&family=Big+Shoulders+Display:wght@700;900&display=swap">
<style>
/* Renders one of 20 Story pictures (1080×1920), picked by #v1…#v20. v1–v10 handmade/paper, v11–v20 minimal. */
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
.pg { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.abs { position: absolute; }
svg.map { position: absolute; display: block; }
.al { display: inline-grid; place-items: center; width: 46px; height: 30px; border-radius: 6px; font: 500 15px "IBM Plex Mono", monospace; color: #fff; flex: none; vertical-align: middle; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- data ---------- */
const AP = { SEA:{lat:47.449,lon:-122.309,city:"Seattle"}, SFO:{lat:37.619,lon:-122.375,city:"San Francisco"}, SJC:{lat:37.363,lon:-121.929,city:"San José"}, DFW:{lat:32.899,lon:-97.040,city:"Dallas"} };
const AL = {
  DL:{name:"Delta",c:"#C8102E",bg:"#C8102E"}, UA:{name:"United",c:"#0033A0",bg:"#0033A0"},
  WN:{name:"Southwest",c:"#304CB2",bg:"linear-gradient(#304CB2 0 66%, #FFBF27 66% 83%, #C60C30 83%)"},
  AS:{name:"Alaska",c:"#01426A",bg:"linear-gradient(#01426A 0 76%, #48A9C5 76%)"},
  F9:{name:"Frontier",c:"#00764F",bg:"#00764F"}, AA:{name:"American",c:"#0078D2",bg:"linear-gradient(#0078D2 0 76%, #C30019 76%)"},
};
const F = [["01-02","SEA","SJC","WN","WN 4693"],["06-12","SFO","SEA","UA","UA 5579"],["06-23","SEA","SJC","AS","AS 319"],["06-30","SFO","SEA","UA","UA 1389"],["07-07","SEA","SJC","DL","DL 3736"],["08-14","SFO","DFW","F9","F9 2376"],["08-17","DFW","SFO","AA","AA 1949"],["09-05","SJC","SEA","DL","DL"],["09-10","SEA","SJC","DL","DL"],["11-14","SFO","SEA","AS","AS 591"],["11-16","SEA","SFO","UA","UA 499"],["11-23","SJC","SEA","WN","WN 2150"],["12-01","SEA","SJC","DL","DL 3736"],["12-19","SJC","SEA","WN","WN 3914"]];
const TRIPS = [["January",[0]],["June",[1,2,3]],["July",[4]],["August",[5,6]],["September",[7,8]],["November",[9,10,11]],["December",[12,13]]];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const today = new Date(); today.setHours(0,0,0,0);
function miles(a,b){const r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r,h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*3958.8*Math.asin(Math.sqrt(h));}
const fl = F.map(([md,from,to,air,no],i)=>{const [m,d]=md.split("-").map(Number);const date=new Date(2026,m-1,d);return{i,md,m:m-1,d,from,to,air,no,date,up:date>=today,mi:miles(AP[from],AP[to])};});
const fmt = n => Math.round(n).toLocaleString("en-US");
const pad = n => String(n).padStart(2,"0");
const TOTAL = fmt(fl.reduce((s,f)=>s+f.mi,0));
const FLOWN = fl.filter(f=>!f.up), BOOKED = fl.filter(f=>f.up);
const badge = c => `<span class="al" style="background:${AL[c].bg}">${c}</span>`;
const cols2 = (fn, cls="") => `<div class="${cls}" style="display:grid;grid-template-columns:1fr 1fr;column-gap:40px">${[fl.slice(0,7),fl.slice(7)].map(c=>`<div>${c.map(fn).join("")}</div>`).join("")}</div>`;

/* ---------- map ---------- */
const S=36,LON0=-130,LAT0=50.5,KX=Math.cos(40*Math.PI/180);
const P=(la,lo)=>[(lo-LON0)*KX*S,(LAT0-la)*S];
const COAST=[[52,-129],[48.4,-124.7],[47.9,-124.6],[46.3,-124.05],[45,-123.95],[43.4,-124.25],[42,-124.2],[40.4,-124.4],[39,-123.7],[38,-122.95],[37.8,-122.5],[37.2,-122.4],[36.6,-121.9],[35.6,-121.2],[34.45,-120.5],[34,-118.5],[33.6,-117.9],[32.5,-117.1],[27,-114]];
let mapN = 0;
function mapSVG(o = {}) {
  const id = "r" + (mapN++);
  const vb = o.vb || "40 40 940 680", fs = o.fs || 32, w = o.w || 3;
  let s = `<svg class="map" viewBox="${vb}" style="${o.style || ""}">`;
  if (o.rough) s += `<defs><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="${o.seed || 3}"/><feDisplacementMap in="SourceGraphic" scale="${o.rough}"/></filter></defs>`;
  s += `<g ${o.rough ? `filter="url(#${id})"` : ""}>`;
  if (o.coast !== false) s += `<path d="M${COAST.map(([a,b])=>P(a,b).map(v=>v.toFixed(1)).join(",")).join(" L")}" fill="none" stroke="${o.coastC || "#bbb"}" stroke-width="${o.coastW || 2}" stroke-linecap="round"/>`;
  const g = {};
  fl.forEach(f => {
    const key=[f.from,f.to].sort().join("-"), n=(g[key]=(g[key]||0)+1)-1;
    const [a,b]=key.split("-").map(k=>P(AP[k].lat,AP[k].lon));
    const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),off=((o.bend||.1)+(o.fan||.075)*n)*len;
    const C=[(a[0]+b[0])/2-dy/len*off,(a[1]+b[1])/2+dx/len*off];
    const st=P(AP[f.from].lat,AP[f.from].lon), e=P(AP[f.to].lat,AP[f.to].lon);
    s += `<path d="M${st} Q${C} ${e}" fill="none" stroke="${f.up ? (o.up || "#999") : (o.flown || "#111")}" stroke-width="${f.up ? (o.upW || w) : w}" stroke-linecap="round" ${f.up ? `stroke-dasharray="${o.dash || "10 9"}"` : ""} opacity="${f.up ? (o.upO || 1) : (o.flownO || 1)}"/>`;
  });
  s += `</g>`;
  const visits={}; fl.forEach(f=>{visits[f.from]=(visits[f.from]||0)+1;visits[f.to]=(visits[f.to]||0)+1;});
  const L={SEA:[.8,.35,"start"],SFO:[-.8,-.15,"end"],SJC:[.8,1.05,"start"],DFW:[-.6,1.35,"end"]};
  Object.entries(AP).forEach(([c,a])=>{
    const [x,y]=P(a.lat,a.lon);
    if (o.circle) s += `<ellipse cx="${x}" cy="${y}" rx="${fs*.62}" ry="${fs*.5}" fill="none" stroke="${o.dotC || o.flown || "#111"}" stroke-width="${w}" transform="rotate(-12 ${x} ${y})" ${o.rough ? `filter="url(#${id})"` : ""}/>`;
    s += `<circle cx="${x}" cy="${y}" r="${o.r || 6}" fill="${o.dotFill || o.flown || "#111"}" stroke="${o.dotC || o.flown || "#111"}" stroke-width="${o.dotW || 0}"/>`;
    if (o.labels !== false) {
      const [lx,ly,an]=L[c];
      s += `<text x="${x+lx*fs}" y="${y+ly*fs}" text-anchor="${an}" font-family="${o.font || "IBM Plex Mono"}" font-size="${fs}" font-weight="${o.fw || 400}" fill="${o.lc || o.flown || "#111"}" letter-spacing="${o.ls || 0}">${c}${o.count ? `<tspan font-size="${fs*.6}" dx="${fs*.2}" fill="${o.countC || o.lc || "#111"}" opacity=".7">×${visits[c]}</tspan>` : ""}</text>`;
    }
  });
  return s + `</svg>`;
}
const bars = (seed, n=60, color="#111") => { let h=0; for (const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0; let out=""; for (let i=0;i<n;i++){ h=(h*1103515245+12345)>>>0; out+=`<i style="display:inline-block;height:100%;margin-right:3px;background:${color};width:${1+(h>>>28)%4}px"></i>`; } return out; };
const next = BOOKED[0];
const daysTo = next ? Math.round((next.date - today) / 864e5) : 0;

/* ---------- variants ---------- */
const V = [];

// 1 · lined notebook, blue pen
V.push(() => `<style>
.v1 { background: repeating-linear-gradient(#fff 0 58px, #cddff3 58px 60px); font-family: Caveat; color: #1f3d8f; }
.v1 .mg { position:absolute; top:0; bottom:0; left:112px; width:3px; background:#ef9aa3; }
.v1 h1 { position:absolute; top:96px; left:150px; font:700 150px/1 Caveat; transform:rotate(-2deg); }
.v1 h2 { position:absolute; top:258px; left:300px; font:500 64px/1 Caveat; color:#e2556a; transform:rotate(-2deg); }
.v1 .row { height:60px; font-size:46px; line-height:60px; white-space:nowrap; }
.v1 .row .k { color:#e2556a; }
.v1 .row.up { color:#7b8bb8; }
</style><div class="pg v1"><div class="mg"></div><h1>2026 flights ✈</h1><h2>my year in the air</h2>
${mapSVG({ style:"top:400px;left:50px;width:990px;height:700px", rough:4, flown:"#1f3d8f", up:"#e2556a", coastC:"#9aa7c4", font:"Caveat", fs:54, fw:700, circle:true, count:true, w:3.4 })}
<div class="abs" style="top:1140px;left:150px;right:60px">${cols2(f => `<div class="row${f.up?" up":""}"><span class="k">${f.up?"☐":"✓"}</span> ${MON[f.m].toLowerCase()} ${f.d} · ${f.from}→${f.to}</div>`)}</div>
<div class="abs" style="top:1620px;left:150px;font-size:52px;line-height:60px">${fl.length} flights · ${TOTAL} miles · 6 airlines :)</div></div>`);

// 2 · kraft paper + label-maker tape
V.push(() => `<style>
.v2 { background: radial-gradient(rgba(90,60,30,.18) 1px, transparent 1.5px) 0 0/9px 9px, radial-gradient(rgba(255,255,255,.12) 1px, transparent 1.5px) 4px 5px/13px 13px, #c6a077; color:#1c140e; }
.v2 h1 { position:absolute; top:110px; left:80px; font:400 210px/.9 "Permanent Marker"; transform:rotate(-3deg); }
.v2 h2 { position:absolute; top:330px; left:110px; font:400 76px/1 "Permanent Marker"; color:#fff; transform:rotate(-3deg); }
.v2 .tape { display:inline-block; background:#151515; color:#eee; font:400 30px/1 "Special Elite"; letter-spacing:.14em; padding:16px 22px 12px; margin:0 0 18px; border-radius:4px; box-shadow:0 3px 6px rgba(0,0,0,.25); text-shadow:0 1px 0 rgba(255,255,255,.25); }
.v2 .tape.up { background:#b3202a; }
</style><div class="pg v2"><h1>2026</h1><h2>in the air</h2>
${mapSVG({ style:"top:470px;left:40px;width:1000px;height:720px", rough:5, flown:"#1c140e", up:"#fff", coastC:"rgba(28,20,14,.45)", font:"Permanent Marker", fs:56, circle:true, w:4, coastW:3 })}
<div class="abs" style="top:1230px;left:80px;right:40px">${cols2((f,j) => `<div><span class="tape${f.up?" up":""}" style="transform:rotate(${(f.i%3-1)*1.2}deg)">${pad(f.m+1)}.${pad(f.d)} ${f.from}→${f.to}</span></div>`)}</div>
<div class="abs" style="bottom:70px;left:80px;font:400 46px 'Permanent Marker'">${fl.length} flights · ${TOTAL} mi</div></div>`);

// 3 · dot-grid bullet journal, mint highlighter
V.push(() => `<style>
.v3 { background: radial-gradient(#b9bdc4 2px, transparent 2.6px) 0 0/40px 40px, #fcfcfc; color:#151515; font-family:Caveat; }
.v3 .tag { position:absolute; top:110px; left:80px; font:500 26px "IBM Plex Mono"; letter-spacing:.3em; border:2px solid #151515; padding:8px 16px; }
.v3 h1 { position:absolute; top:170px; left:80px; font:700 190px/1 Caveat; }
.v3 h1 span { background:linear-gradient(transparent 58%, #9be3c8 58% 88%, transparent 88%); padding:0 10px; }
.v3 .row { font-size:44px; line-height:62px; white-space:nowrap; }
.v3 .row b { display:inline-block; width:40px; font-weight:700; }
.v3 .row.up span { background:linear-gradient(transparent 55%, #9be3c8 55%); }
.v3 .key { position:absolute; bottom:90px; left:80px; right:80px; border-top:2px solid #151515; padding-top:16px; display:flex; justify-content:space-between; font:500 24px "IBM Plex Mono"; letter-spacing:.08em; }
</style><div class="pg v3"><div class="tag">FLIGHT LOG</div><h1><span>2026</span></h1>
${mapSVG({ style:"top:420px;left:40px;width:1000px;height:720px", rough:3, flown:"#151515", up:"#2fb88a", coastC:"#b9bdc4", font:"Caveat", fs:54, fw:700, circle:true, w:2.6, upW:4 })}
<div class="abs" style="top:1190px;left:80px;right:60px">${cols2(f => `<div class="row${f.up?" up":""}"><b>${f.up?"•":"×"}</b><span>${MON[f.m].toLowerCase()} ${pad(f.d)}  ${f.from.toLowerCase()} → ${f.to.toLowerCase()}</span></div>`)}</div>
<div class="key"><span>× FLOWN ${FLOWN.length}</span><span>• BOOKED ${BOOKED.length}</span><span>${TOTAL} MI</span></div></div>`);

// 4 · postcard on a desk
V.push(() => `<style>
.v4 { background:#2c3341; }
.v4 .card { position:absolute; top:120px; left:70px; width:940px; height:1660px; background:#fbfaf7; transform:rotate(-2deg); box-shadow:0 30px 60px rgba(0,0,0,.4); padding:70px 70px; color:#283044; font-family:Caveat; }
.v4 .hd { font:400 34px "Special Elite"; letter-spacing:.5em; color:#8a8f9c; }
.v4 .stamp { position:absolute; top:60px; right:60px; width:220px; height:270px; background:#fff; border:3px dashed #c2343e; padding:12px; transform:rotate(3deg); }
.v4 .stamp .in { width:100%; height:100%; background:#e8eef7; position:relative; overflow:hidden; }
.v4 .stamp small { position:absolute; bottom:8px; left:10px; font:400 18px "Special Elite"; color:#c2343e; }
.v4 .pm { position:absolute; top:250px; right:200px; width:230px; height:230px; opacity:.6; }
.v4 .msg { font-size:52px; line-height:1.18; margin-top:290px; }
.v4 .row { font-size:44px; line-height:60px; white-space:nowrap; }
.v4 .row.up { color:#b07a2b; }
.v4 .sig { font:700 64px Caveat; margin-top:30px; }
</style><div class="pg v4"><div class="card"><div class="hd">POST CARD</div>
<div class="stamp"><div class="in">${mapSVG({ style:"inset:0;width:100%;height:100%", vb:"120 60 860 640", flown:"#2b4c8c", up:"#c2343e", labels:false, w:6, coastC:"#9aa8c0", coastW:4, r:10 })}<small>2026 · AIR MAIL</small></div></div>
<svg class="pm" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#283044" stroke-width="2"/><circle cx="50" cy="50" r="30" fill="none" stroke="#283044" stroke-width="1"/><text x="50" y="47" text-anchor="middle" font-family="Special Elite" font-size="10" fill="#283044">IN THE AIR</text><text x="50" y="60" text-anchor="middle" font-family="Special Elite" font-size="9" fill="#283044">2026</text><path d="M95 30 q10 5 20 0 t20 0 M95 45 q10 5 20 0 t20 0 M95 60 q10 5 20 0 t20 0" stroke="#283044" fill="none" transform="translate(-10 0)"/></svg>
<div class="msg">Dear me, —<br>2026 was ${fl.length} flights, ${TOTAL} miles and 6 airlines. Here's every one:</div>
<div style="margin-top:26px">${cols2(f => `<div class="row${f.up?" up":""}">${MON[f.m].toLowerCase()} ${f.d} — ${f.from}→${f.to}${f.up?" (soon!)":""}</div>`)}</div>
<div class="sig">see you up there ✈ — T</div></div></div>`);

// 5 · sticky notes per trip
V.push(() => { const cols=["#ffe680","#ffb3c7","#a8e6cf","#a0d2ff","#ffd0a0","#d9c2ff","#fff3a0"]; return `<style>
.v5 { background:#eceef1; font-family:Caveat; color:#262a33; }
.v5 h1 { position:absolute; top:100px; left:80px; font:700 140px/1 Caveat; transform:rotate(-2deg); }
.v5 .n { position:absolute; width:440px; height:330px; padding:28px 30px; box-shadow:0 12px 20px rgba(30,30,50,.16); }
.v5 .n b { display:block; font:400 54px/1 "Permanent Marker"; margin-bottom:14px; }
.v5 .n div { font-size:42px; line-height:52px; white-space:nowrap; }
.v5 .pin { position:absolute; top:-12px; left:50%; width:26px; height:26px; margin-left:-13px; border-radius:50%; background:#d33; box-shadow:0 3px 4px rgba(0,0,0,.3); }
</style><div class="pg v5"><h1>2026 ✈ flights</h1>
${TRIPS.map(([m,ids],k)=>{ const x=70+(k%2)*500, y=330+Math.floor(k/2)*370, r=[-3,2,-1.5,3,-2.5,1.5,-2][k]; return `<div class="n" style="left:${x}px;top:${y}px;background:${cols[k]};transform:rotate(${r}deg)"><span class="pin"></span><b>${m}</b>${ids.map(i=>{const f=fl[i];return `<div>${f.d} · ${f.from} → ${f.to} ${f.up?"☐":"✓"}</div>`;}).join("")}</div>`; }).join("")}
<div class="n" style="left:570px;top:1440px;background:#fff;transform:rotate(2deg)"><span class="pin" style="background:#2b4c8c"></span><b>total</b><div>${fl.length} flights</div><div>${TOTAL} miles</div><div>6 airlines, 4 airports</div></div></div>`; });

// 6 · itemized receipt
V.push(() => `<style>
.v6 { background:#dfe3e8; }
.v6 .rc { position:absolute; top:80px; left:170px; width:740px; height:1760px; background:#fff; padding:60px 54px; font:400 27px/1.5 "IBM Plex Mono"; color:#232323; transform:rotate(1deg); box-shadow:0 20px 40px rgba(20,30,50,.18); }
.v6 .rc::after { content:""; position:absolute; left:0; right:0; bottom:-14px; height:14px; background:linear-gradient(135deg, #fff 50%, transparent 50%) 0 0/28px 28px, linear-gradient(225deg, #fff 50%, transparent 50%) 0 0/28px 28px; }
.v6 .c { text-align:center; }
.v6 h1 { font:700 56px/1.1 "IBM Plex Mono"; text-align:center; letter-spacing:.06em; }
.v6 .hr { border-top:2px dashed #999; margin:22px 0; }
.v6 .it { display:grid; grid-template-columns:110px 1fr 70px 100px; }
.v6 .it span:nth-child(n+3) { text-align:right; }
.v6 .it.up { color:#8a8a8a; }
.v6 .tot { display:flex; justify-content:space-between; font-weight:700; font-size:40px; }
.v6 .sub { display:flex; justify-content:space-between; }
.v6 .bc { height:90px; margin:30px auto 10px; width:max-content; }
</style><div class="pg v6"><div class="rc">
<h1>FLIGHT LOG</h1><div class="c">2026 · ITEMIZED · TINGYUN</div><div class="c" style="color:#777">ORDER #2026-${fl.length}</div><div class="hr"></div>
<div class="it" style="color:#777"><span>DATE</span><span>ROUTE</span><span>AIR</span><span>MI</span></div><div class="hr" style="margin:10px 0"></div>
${fl.map(f=>`<div class="it${f.up?" up":""}"><span>${pad(f.m+1)}/${pad(f.d)}</span><span>${f.from}→${f.to}${f.up?" *":""}</span><span>${f.air}</span><span>${fmt(f.mi)}</span></div>`).join("")}
<div class="hr"></div>
<div class="sub"><span>FLOWN (${FLOWN.length})</span><span>${fmt(FLOWN.reduce((s,f)=>s+f.mi,0))}</span></div>
<div class="sub"><span>BOOKED* (${BOOKED.length})</span><span>${fmt(BOOKED.reduce((s,f)=>s+f.mi,0))}</span></div>
<div class="hr"></div><div class="tot"><span>TOTAL MILES</span><span>${TOTAL}</span></div>
<div class="sub" style="margin-top:10px"><span>AIRLINES</span><span>6</span></div><div class="sub"><span>AIRPORTS</span><span>4</span></div>
<div class="bc">${bars("receipt2026", 70, "#232323")}</div>
<div class="c">THANK YOU FOR FLYING</div><div class="c" style="color:#777">* NOT FLOWN YET</div></div></div>`);

// 7 · passport stamps
V.push(() => { const inks=["#6b2fa0","#b3202a","#1d6b3a","#1f4fa3"]; return `<style>
.v7 { background: repeating-radial-gradient(circle at 50% 42%, transparent 0 16px, rgba(40,100,90,.07) 16px 18px), repeating-linear-gradient(60deg, transparent 0 22px, rgba(40,100,90,.05) 22px 23px), #dfeae5; }
.v7 .hd { position:absolute; top:70px; left:80px; right:80px; display:flex; justify-content:space-between; font:400 26px "Special Elite"; letter-spacing:.4em; color:#4f6f68; }
.v7 .st { position:absolute; display:grid; place-items:center; text-align:center; mix-blend-mode:multiply; font-family:"Special Elite"; }
.v7 .st b { font:900 74px/1 "Big Shoulders Display"; letter-spacing:.06em; display:block; }
.v7 .st small { font-size:20px; letter-spacing:.14em; display:block; }
.v7 .pgno { position:absolute; bottom:60px; left:0; right:0; text-align:center; font:400 28px "Special Elite"; color:#4f6f68; }
</style><div class="pg v7"><div class="hd"><span>VISAS</span><span>2026</span></div>
${fl.map((f,k)=>{ const col=k%3,row=Math.floor(k/3),x=70+col*325+((k*37)%30)-15,y=190+row*330+((k*53)%40)-20,rot=((k*47)%28)-14,ink=inks[k%4],shape=k%3,
  css = shape===0 ? "width:250px;height:250px;border-radius:50%;border:6px double" : shape===1 ? "width:280px;height:190px;border-radius:10px;border:6px double" : "width:290px;height:200px;border-radius:50%;border:5px solid";
  return `<div class="st" style="left:${x}px;top:${y}px;${css} ${ink};color:${ink};transform:rotate(${rot}deg);opacity:${f.up?.42:.85};${f.up?"border-style:dashed;":""}"><div><small>${f.up?"BOOKED":"ARRIVED"}</small><b>${f.to}</b><small>${pad(f.d)} ${MON[f.m].toUpperCase()} 2026</small><small>${AL[f.air].name.toUpperCase()}</small></div></div>`; }).join("")}
<div class="st" style="left:720px;top:1560px;width:250px;height:250px;border-radius:50%;border:6px double #1f4fa3;color:#1f4fa3;transform:rotate(-8deg)"><div><small>ENTRIES</small><b>${fl.length}</b><small>${TOTAL} MI</small></div></div>
<div class="pgno">— 14 —</div></div>`; });
